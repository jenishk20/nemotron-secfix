<svg xmlns='http://www.w3.org/2000/svg' width='900' height='300' viewBox='0 0 900 300' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><title>CyberNemo pipeline</title><rect width='900' height='300' rx='8' fill='#1a1a19'/><text x='20' y='28' font-size='15' font-weight='600' fill='#f0efec'>How CyberNemo is built</text><text x='20' y='46' font-size='12' fill='#c3c2b7'>Steps 1-2 build training data; 3 trains the model; 4 runs at inference time</text><rect x='20' y='70' width='200' height='150' rx='10' fill='#262624' stroke='#33332f' stroke-width='2'/><text x='32' y='96' font-size='13' font-weight='600' fill='#f0efec'>1. Synthetic tasks</text><text x='32' y='122' font-size='11.5' fill='#c3c2b7'>1,813 coding tasks, 4 languages</text><text x='32' y='144' font-size='11.5' fill='#c3c2b7'>spec + secure &amp; vulnerable refs</text><text x='32' y='166' font-size='11.5' fill='#c3c2b7'>+ functionality &amp; attack tests</text><text x='32' y='188' font-size='11.5' fill='#c3c2b7'>verified in an offline sandbox</text><path d='M224,145 H254' stroke='#898781' stroke-width='2'/><path d='M248,139 L256,145 L248,151' fill='none' stroke='#898781' stroke-width='2'/><rect x='240' y='70' width='200' height='150' rx='10' fill='#262624' stroke='#33332f' stroke-width='2'/><text x='252' y='96' font-size='13' font-weight='600' fill='#f0efec'>2. Self-distillation</text><text x='252' y='122' font-size='11.5' fill='#c3c2b7'>Nemotron 120B solves each task</text><text x='252' y='144' font-size='11.5' fill='#c3c2b7'>with reasoning + security hint</text><text x='252' y='166' font-size='11.5' fill='#c3c2b7'>keep only answers passing ALL</text><text x='252' y='188' font-size='11.5' fill='#c3c2b7'>tests (W&amp;B Sandboxes)</text><path d='M444,145 H474' stroke='#898781' stroke-width='2'/><path d='M468,139 L476,145 L468,151' fill='none' stroke='#898781' stroke-width='2'/><rect x='460' y='70' width='200' height='150' rx='10' fill='#262624' stroke='#3987e5' stroke-width='2'/><text x='472' y='96' font-size='13' font-weight='600' fill='#f0efec'>3. LoRA SFT on Fireworks</text><text x='472' y='122' font-size='11.5' fill='#c3c2b7'>plain prompt &#8594; own verified code</text><text x='472' y='144' font-size='11.5' fill='#c3c2b7'>rank 16, 1 epoch, ~$10</text><text x='472' y='166' font-size='11.5' fill='#c3c2b7'>&#8658; CyberNemo: secure by</text><text x='472' y='188' font-size='11.5' fill='#c3c2b7'>default, no hint needed</text><path d='M664,145 H694' stroke='#898781' stroke-width='2'/><path d='M688,139 L696,145 L688,151' fill='none' stroke='#898781' stroke-width='2'/><rect x='680' y='70' width='200' height='150' rx='10' fill='#262624' stroke='#199e70' stroke-width='2'/><text x='692' y='96' font-size='13' font-weight='600' fill='#f0efec'>4. Security-review harness</text><text x='692' y='122' font-size='11.5' fill='#c3c2b7'>CyberNemo reviews its own code</text><text x='692' y='144' font-size='11.5' fill='#c3c2b7'>against an OWASP/CWE checklist</text><text x='692' y='166' font-size='11.5' fill='#c3c2b7'>and returns the fixed version</text><text x='692' y='188' font-size='11.5' fill='#c3c2b7'>(never sees benchmark tests)</text><rect x='20' y='240' width='860' height='40' rx='10' fill='#262624' stroke='#33332f'/><text x='36' y='265' font-size='12' fill='#c3c2b7'><tspan font-weight='600' fill='#f0efec'>Evaluation:</tspan> CWEval, 100 held-out human-written tasks; every answer run against functionality + attack tests, offline; paired bootstrap CIs</text></svg>