<svg xmlns='http://www.w3.org/2000/svg' width='820' height='360' viewBox='0 0 820 360' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><title>CyberNemo: SFT fine-tune + security-review harness</title><rect width='820' height='360' rx='8' fill='#fcfcfb'/><text x='20' y='28' font-size='15' font-weight='600' fill='#0b0b0b'>How CyberNemo works: two parts</text><text x='20' y='46' font-size='12' fill='#52514e'>Part 1 changes the model (training). Part 2 wraps it at answer time (harness).</text><rect x='20' y='64' width='380' height='230' rx='12' fill='#f1f0ec' stroke='#2a78d6' stroke-width='2'/><text x='38' y='94' font-size='15' font-weight='700' fill='#0b0b0b'>1  SFT fine-tune</text><text x='38' y='114' font-size='12' fill='#52514e'>teaches secure habits  (+4.9 works+secure)</text><rect x='38' y='136' width='344' height='44' rx='8' fill='#fcfcfb' stroke='#e7e6e2'/><text x='50' y='154' font-size='12' fill='#0b0b0b'>Practice tasks: 1,813 coding tasks with attack tests</text><text x='50' y='171' font-size='12' fill='#52514e'>(written by Nemotron 3 Ultra, verified in a sandbox)</text><path d='M210,180 V188' stroke='#898781' stroke-width='2'/><rect x='38' y='188' width='344' height='44' rx='8' fill='#fcfcfb' stroke='#e7e6e2'/><text x='50' y='206' font-size='12' fill='#0b0b0b'>Self-distillation: Nemotron 120B solves them;</text><text x='50' y='223' font-size='12' fill='#52514e'>keep only its answers that pass every test</text><path d='M210,232 V240' stroke='#898781' stroke-width='2'/><rect x='38' y='240' width='344' height='30' rx='8' fill='#fcfcfb' stroke='#e7e6e2'/><text x='50' y='258' font-size='12' fill='#0b0b0b'>LoRA SFT on Fireworks  &#8594;  CyberNemo</text><rect x='420' y='64' width='380' height='230' rx='12' fill='#f1f0ec' stroke='#1baf7a' stroke-width='2'/><text x='438' y='94' font-size='15' font-weight='700' fill='#0b0b0b'>2  Security-review harness</text><text x='438' y='114' font-size='12' fill='#52514e'>catches what is left  (+8.9 works+secure)</text><rect x='438' y='136' width='344' height='44' rx='8' fill='#fcfcfb' stroke='#e7e6e2'/><text x='450' y='154' font-size='12' fill='#0b0b0b'>CyberNemo writes the code</text><path d='M610,180 V188' stroke='#898781' stroke-width='2'/><rect x='438' y='188' width='344' height='44' rx='8' fill='#fcfcfb' stroke='#e7e6e2'/><text x='450' y='206' font-size='12' fill='#0b0b0b'>Same model reviews it against a security checklist</text><text x='450' y='223' font-size='12' fill='#52514e'>(escape HTML, reject CR/LF, check paths and URLs, ...)</text><path d='M610,232 V240' stroke='#898781' stroke-width='2'/><rect x='438' y='240' width='344' height='30' rx='8' fill='#fcfcfb' stroke='#e7e6e2'/><text x='450' y='258' font-size='12' fill='#0b0b0b'>Returns the fixed code; never sees benchmark tests</text><path d='M403,180 H415' stroke='#898781' stroke-width='2'/><path d='M409,174 L417,180 L409,186' fill='none' stroke='#898781' stroke-width='2'/><rect x='20' y='308' width='780' height='36' rx='10' fill='#f1f0ec' stroke='#e7e6e2'/><text x='36' y='331' font-size='12' fill='#52514e'><tspan font-weight='600' fill='#0b0b0b'>Evaluation:</tspan> CWEval: 100 held-out human-written tasks, functionality + attack tests, run offline</text></svg>